<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website Character Pack v2 — Highlighter Functional Proof</title>
<style>
  :root { --paper:#F4F3EF; --ink:#121212; --yellow:#F4E35C; --yellow-deep:#D9C62A; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font:16px/1.45 system-ui,sans-serif; }
  .proof { width:min(720px,92vw); background:#fff; border:1px solid #E2E2DC; border-radius:12px; padding:32px; }
  .proof h1 { margin:0 0 8px; font-size:1.2rem; }
  .proof p { margin:0 0 24px; color:#555; }
  .sentence { position:relative; display:inline-block; padding:24px 18px 34px; font:700 28px/1.35 Georgia,serif; }
  .target { position:relative; z-index:1; white-space:nowrap; }
  .target::after { content:""; position:absolute; z-index:-1; left:-2px; right:-2px; bottom:1px; height:.58em; background:var(--yellow); transform:scaleX(0); transform-origin:left center; transition:transform .72s cubic-bezier(.16,1,.3,1); opacity:.8; }
  .stage.active .target::after { transform:scaleX(1); }
  .stage { position:relative; min-height:120px; border:1px solid #D8D8D0; border-radius:10px; overflow:hidden; background:#FAFAF6; }
  .highlighter { position:absolute; left:18px; bottom:15px; width:92px; height:22px; transform:rotate(-7deg); transform-origin:82px 11px; transition:left .72s cubic-bezier(.16,1,.3,1); }
  .stage.active .highlighter { left:clamp(145px,52%,235px); }
  .marker-body { position:absolute; left:0; top:0; width:72px; height:22px; border-radius:4px 2px 2px 4px; background:linear-gradient(180deg,#FFF37A,var(--yellow)); border:1px solid #CDBB2F; }
  .marker-cap { position:absolute; right:0; top:1px; width:22px; height:20px; border-radius:2px 5px 5px 2px; background:#3B3B38; }
  .marker-tip { position:absolute; right:-8px; top:6px; width:10px; height:10px; background:var(--yellow-deep); clip-path:polygon(0 15%,100% 0,100% 100%,0 85%); }
  .controls { display:flex; gap:12px; align-items:center; margin-top:18px; flex-wrap:wrap; }
  button { min-height:48px; border:0; border-radius:8px; padding:0 16px; background:#121212; color:#fff; font-weight:800; cursor:pointer; }
  button:focus-visible { outline:3px solid #005fcc; outline-offset:3px; }
  .status { color:#555; }
  @media (max-width:460px) {
    .proof { padding:20px; }
    .sentence { padding:20px 14px 34px; font-size:22px; }
    .highlighter { left:12px; }
    .stage.active .highlighter { left:clamp(118px,48%,158px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .highlighter, .target::after { transition:none !important; }
  }
</style>
</head>
<body>
<main class="proof">
  <h1>Highlighter — emphasizes</h1>
  <p>Function proof: emphasis is created by a real highlighter crossing the exact text it marks.</p>
  <div class="stage" id="stage">
    <div class="sentence">Good questions start with <span class="target">evidence</span>.</div>
    <div class="highlighter" aria-hidden="true">
      <span class="marker-body"></span><span class="marker-cap"></span><span class="marker-tip"></span>
    </div>
  </div>
  <div class="controls">
    <button type="button" id="apply">Emphasize evidence</button>
    <span class="status" id="status" role="status" aria-live="polite">Nothing emphasized yet.</span>
  </div>
</main>
<script>
  const stage = document.getElementById('stage');
  const status = document.getElementById('status');
  document.getElementById('apply').addEventListener('click', () => {
    stage.classList.remove('active');
    requestAnimationFrame(() => {
      stage.classList.add('active');
      status.textContent = 'Emphasis applied to evidence.';
    });
  });
</script>
</body>
</html>
