<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website Character Pack v2 — Sticky Note Functional Proof</title>
<style>
  :root { --paper:#F4F3EF; --ink:#121212; --note:#F6E978; --note2:#E7D95D; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font:16px/1.45 system-ui,sans-serif; }
  .proof { width:min(700px,92vw); background:#fff; border:1px solid #E2E2DC; border-radius:12px; padding:32px; }
  h1 { margin:0 0 8px; font-size:1.2rem; }
  p { color:#555; margin:0 0 24px; }
  .stage { min-height:260px; display:grid; place-items:center; border:1px solid #D8D8D0; border-radius:10px; background:#FAFAF6; }
  .sticky { position:relative; width:190px; height:190px; padding:26px 22px 22px; background:linear-gradient(145deg,var(--note),var(--note2)); box-shadow:0 12px 22px rgba(0,0,0,.14); transform:rotate(-2deg) scale(.96); transition:transform .45s cubic-bezier(.16,1,.3,1); }
  .sticky::after { content:""; position:absolute; right:0; bottom:0; width:38px; height:38px; background:linear-gradient(135deg,#CDBF44 0 49%,#FFF3A0 50% 100%); clip-path:polygon(0 100%,100% 0,100% 100%); }
  .stage.active .sticky { transform:rotate(0deg) scale(1); }
  .note-label { font:800 11px/1.2 system-ui,sans-serif; letter-spacing:.1em; text-transform:uppercase; color:#6D621C; }
  .memory { margin-top:18px; font:700 22px/1.25 Georgia,serif; min-height:84px; }
  .memory[hidden] { display:block; visibility:hidden; }
  button { min-height:48px; margin-top:18px; border:0; border-radius:8px; padding:0 16px; background:#121212; color:#fff; font-weight:800; cursor:pointer; }
  button:focus-visible { outline:3px solid #005fcc; outline-offset:3px; }
  .status { margin-left:12px; color:#555; }
  @media (prefers-reduced-motion: reduce) { .sticky { transition:none !important; } }
</style>
</head>
<body>
<main class="proof">
  <h1>Sticky Note — remembers</h1>
  <p>Function proof: a real sticky note holds one short, deterministic reminder. It does not invent or rewrite memory.</p>
  <div class="stage" id="stage">
    <div class="sticky" role="img" aria-label="Sticky note">
      <div class="note-label">Remember</div>
      <div class="memory" id="memory" hidden>Check the evidence before deciding.</div>
    </div>
  </div>
  <button type="button" id="remember">Remember this</button>
  <span class="status" id="status" role="status" aria-live="polite">No reminder stored.</span>
</main>
<script>
  const stage = document.getElementById('stage');
  const memory = document.getElementById('memory');
  const status = document.getElementById('status');
  document.getElementById('remember').addEventListener('click', () => {
    stage.classList.add('active');
    memory.hidden = false;
    status.textContent = 'Reminder stored: Check the evidence before deciding.';
  });
</script>
</body>
</html>
