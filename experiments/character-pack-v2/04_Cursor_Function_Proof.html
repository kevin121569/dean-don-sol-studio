<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website Character Pack v2 — Cursor Functional Proof</title>
<style>
  :root { --paper:#F4F3EF; --ink:#121212; --blue:#1A2B4C; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font:16px/1.45 system-ui,sans-serif; }
  .proof { width:min(720px,92vw); background:#fff; border:1px solid #E2E2DC; border-radius:12px; padding:32px; }
  h1 { margin:0 0 8px; font-size:1.2rem; }
  p { color:#555; margin:0 0 24px; }
  .stage { position:relative; min-height:250px; border:1px solid #D8D8D0; border-radius:10px; background:#FAFAF6; padding:28px; }
  .choices { display:grid; gap:12px; width:min(360px,100%); }
  .choice { min-height:52px; display:flex; align-items:center; padding:0 16px; border:1px solid #C9C9C0; border-radius:8px; background:#fff; color:#121212; font-weight:800; cursor:pointer; text-align:left; }
  .choice[aria-pressed="true"] { border-color:var(--blue); box-shadow:0 0 0 2px rgba(26,43,76,.14); }
  .choice:focus-visible { outline:3px solid #005fcc; outline-offset:3px; }
  .cursor { position:absolute; left:16px; top:43px; width:26px; height:34px; pointer-events:none; transform:translate(0,0); transition:transform .34s cubic-bezier(.16,1,.3,1); }
  .cursor::before { content:""; position:absolute; inset:0; background:#121212; clip-path:polygon(0 0,0 90%,28% 66%,43% 100%,56% 94%,42% 61%,78% 61%); }
  .cursor::after { content:""; position:absolute; inset:3px 5px 6px 3px; background:#fff; clip-path:polygon(0 0,0 86%,27% 64%,41% 96%,48% 92%,35% 57%,70% 57%); }
  .status { margin-top:16px; min-height:24px; color:#555; }
  @media (prefers-reduced-motion: reduce) { .cursor { transition:none !important; } }
</style>
</head>
<body>
<main class="proof">
  <h1>Cursor — chooses</h1>
  <p>Function proof: the cursor only indicates the user’s semantic selection. The buttons remain the actual controls.</p>
  <div class="stage" id="stage">
    <div class="choices" role="group" aria-label="Choose the next action">
      <button class="choice" type="button" data-index="0" aria-pressed="false">Draft</button>
      <button class="choice" type="button" data-index="1" aria-pressed="false">Verify</button>
      <button class="choice" type="button" data-index="2" aria-pressed="false">Publish</button>
    </div>
    <div class="cursor" id="cursor" aria-hidden="true"></div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite">No choice selected.</div>
</main>
<script>
  const buttons = [...document.querySelectorAll('.choice')];
  const cursor = document.getElementById('cursor');
  const status = document.getElementById('status');
  const offsets = [0,64,128];
  buttons.forEach(button => {
    button.addEventListener('click', () => {
      buttons.forEach(b => b.setAttribute('aria-pressed','false'));
      button.setAttribute('aria-pressed','true');
      const index = Number(button.dataset.index);
      cursor.style.transform = `translate(366px, ${offsets[index]}px)`;
      status.textContent = `Selected: ${button.textContent}.`;
    });
  });
</script>
</body>
</html>
