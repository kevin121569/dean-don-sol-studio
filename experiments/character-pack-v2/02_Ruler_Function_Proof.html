<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website Character Pack v2 — Ruler Functional Proof</title>
<style>
  :root { --paper:#F4F3EF; --ink:#121212; --wood:#D6B37A; --wood2:#B78D51; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font:16px/1.45 system-ui,sans-serif; }
  .proof { width:min(760px,92vw); background:#fff; border:1px solid #E2E2DC; border-radius:12px; padding:32px; }
  h1 { margin:0 0 8px; font-size:1.2rem; }
  p { color:#555; margin:0 0 24px; }
  .stage { position:relative; min-height:230px; border:1px solid #D8D8D0; border-radius:10px; background:#FAFAF6; padding:26px; overflow:hidden; }
  .bar-row { display:grid; gap:18px; max-width:420px; }
  .bar-wrap { display:grid; grid-template-columns:78px 1fr; gap:12px; align-items:center; }
  .bar { height:22px; background:#1A2B4C; border-radius:3px; }
  .bar.a { width:120px; }
  .bar.b { width:180px; }
  .ruler { position:absolute; left:104px; bottom:26px; width:210px; height:38px; border:1px solid #9D743F; border-radius:3px; background:linear-gradient(180deg,#E6C995,var(--wood)); transform:translateY(58px); transition:transform .62s cubic-bezier(.16,1,.3,1); box-shadow:0 3px 8px rgba(0,0,0,.12); }
  .stage.active .ruler { transform:translateY(0); }
  .ruler::before { content:""; position:absolute; inset:0; background:repeating-linear-gradient(90deg,transparent 0 9px,#5C4428 9px 10px); opacity:.8; }
  .ruler::after { content:"0   20   40   60   80   100   120   140   160   180"; position:absolute; left:5px; right:5px; bottom:2px; font:9px/1 ui-monospace,monospace; color:#4B3823; letter-spacing:1px; white-space:nowrap; overflow:hidden; }
  .measure-line { position:absolute; left:224px; top:78px; width:2px; height:73px; background:#9A3B2E; opacity:0; transition:opacity .2s ease .45s; }
  .stage.active .measure-line { opacity:1; }
  .result { margin-top:18px; min-height:24px; font-weight:800; }
  button { min-height:48px; margin-top:18px; border:0; border-radius:8px; padding:0 16px; background:#121212; color:#fff; font-weight:800; cursor:pointer; }
  button:focus-visible { outline:3px solid #005fcc; outline-offset:3px; }
  @media (max-width:460px) {
    .proof { padding:20px; }
    .stage { min-height:220px; padding:18px; }
    .bar-wrap { grid-template-columns:64px 1fr; gap:10px; }
    .bar.a { width:90px; }
    .bar.b { width:135px; }
    .ruler { left:80px; bottom:20px; width:160px; }
    .ruler::after { content:"0   20   40   60   80   100   120"; font-size:8px; letter-spacing:.5px; }
    .measure-line { left:229px; top:70px; height:70px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ruler,.measure-line { transition:none !important; }
  }
</style>
</head>
<body>
<main class="proof">
  <h1>Ruler — measures</h1>
  <p>Function proof: a physical ruler aligns to two lengths and reports their deterministic difference.</p>
  <div class="stage" id="stage">
    <div class="bar-row">
      <div class="bar-wrap"><strong>Line A</strong><div class="bar a" aria-label="Line A, 120 pixels"></div></div>
      <div class="bar-wrap"><strong>Line B</strong><div class="bar b" aria-label="Line B, 180 pixels"></div></div>
    </div>
    <div class="measure-line" aria-hidden="true"></div>
    <div class="ruler" aria-hidden="true"></div>
  </div>
  <button type="button" id="measure">Measure the difference</button>
  <div class="result" id="result" role="status" aria-live="polite">No measurement yet.</div>
</main>
<script>
  const stage = document.getElementById('stage');
  const result = document.getElementById('result');
  document.getElementById('measure').addEventListener('click', () => {
    stage.classList.add('active');
    result.textContent = 'Line B is 60 px longer than Line A.';
  });
</script>
</body>
</html>
