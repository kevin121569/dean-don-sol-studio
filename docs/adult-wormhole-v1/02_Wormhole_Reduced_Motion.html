<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>02 Wormhole Reduced Motion Proof (Static Seam Lock)</title>
<style>
  body {
    background: #F4F3EF;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: "Georgia", serif;
  }

  .stage-card {
    position: relative;
    width: 640px;
    background: #FFFFFF;
    border: 1px solid #E2E2DC;
    box-shadow: 0 10px 30px rgba(0,0,0,0.04);
    overflow: hidden;
  }

  .visual-display {
    position: relative;
    width: 640px;
    height: 240px;
    overflow: hidden;
  }

  .stage-header {
    position: absolute;
    top: 18px;
    left: 24px;
    font-family: monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #888880;
  }

  .refractive-seam {
    position: absolute;
    left: 320px;
    top: 40px;
    bottom: 40px;
    width: 1px;
    background: #C5A059;
  }

  .refractive-seam::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: -8px;
    width: 17px;
    background: linear-gradient(90deg, rgba(197,160,89,0) 0%, rgba(197,160,89,0.12) 50%, rgba(197,160,89,0) 100%);
  }

  .layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 640px;
    height: 240px;
  }

  .layer-left {
    clip-path: polygon(0 0, 320px 0, 320px 100%, 0 100%);
  }

  .layer-right {
    clip-path: polygon(320px 0, 640px 0, 640px 100%, 320px 100%);
  }

  .bend-space {
    position: absolute;
    top: 0;
    left: 0;
    width: 640px;
    height: 240px;
    transform-origin: 320px 120px;
    transform: rotate(-3.5deg);
  }

  .mover-settled {
    position: absolute;
    top: 100px;
    left: 0;
    width: 640px;
    height: 40px;
    transform: translateX(220px);
  }

  .object-form {
    display: flex;
    align-items: center;
    white-space: nowrap;
    font-size: 16px;
    letter-spacing: 1.5px;
  }

  .form-straight { color: #1A1A1A; }
  .form-bent { color: #1A2B4C; }

  .rule-line {
    width: 80px;
    height: 1.5px;
    background: currentColor;
    margin: 0 12px;
  }

  .stage-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: #FFFFFF;
    border-top: 1px solid #E2E2DC;
    font-size: 13px;
    font-style: italic;
    color: #1A2B4C;
  }
</style>
</head>
<body>

<div class="stage-card">
  <div class="visual-display" role="img" aria-label="Static demonstration of wormhole refraction: a line enters straight on the left, passes through the brass seam at center x=320, and emerges bent on the right with zero seam displacement.">
    <div class="stage-header">Adult Catalog / Reduced Motion Static Lock</div>
    
    <div class="refractive-seam" aria-hidden="true"></div>

    <div class="layer layer-left" aria-hidden="true">
      <div class="mover-settled">
        <div class="object-form form-straight">
          <div class="rule-line"></div>
          <span>COGNITIVE PARADIGM</span>
          <div class="rule-line"></div>
        </div>
      </div>
    </div>

    <div class="layer layer-right" aria-hidden="true">
      <div class="bend-space">
        <div class="mover-settled">
          <div class="object-form form-bent">
            <div class="rule-line"></div>
            <span>COGNITIVE PARADIGM</span>
            <div class="rule-line"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="stage-footer">
    <div>“Go in straight. Come out bent.”</div>
  </div>
</div>

</body>
</html>
