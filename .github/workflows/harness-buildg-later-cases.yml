name: HARNESS Build G Native Cases 2–5 Screen Gate

on:
  push:
    branches:
      - test/harness-buildg-native-later-cases-20261030
    paths:
      - "android/harness-campaign-qa/scripts/android-later-cases-cdp.py"
      - ".github/workflows/harness-buildg-later-cases.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  native-later-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout test-only changes
        uses: actions/checkout@v4
      - name: Retrieve existing verified Build G Android APK
        uses: actions/download-artifact@v4
        with:
          name: HARNESS-QA-FIVE-CASES-FULL5-20261029-G
          repository: ${{ github.repository }}
          run-id: 40886104535
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: qa-apk
      - name: Check APK checksum and test harness
        run: |
          (cd qa-apk && sha256sum -c HARNESS-QA-FIVE-CASES-FULL5-20261029-G.apk.sha256)
          python3 -m py_compile android/harness-campaign-qa/scripts/android-later-cases-cdp.py
          python3 -m pip install --disable-pip-version-check --user websocket-client==1.8.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check Android WebView screens for Cases 2–5
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python3 android/harness-campaign-qa/scripts/android-later-cases-cdp.py
      - name: Save native screenshots and detailed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HARNESS-Build-G-Cases2-5-Native-QA-Evidence
          path: harness-later-cases-evidence/
          if-no-files-found: warn
          retention-days: 14
