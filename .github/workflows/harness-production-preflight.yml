name: HARNESS Production Prep Preflight

on:
  push:
    branches:
      - prep/harness-production-android-20261031
    paths:
      - "android/harness-production/**"
      - "games/harness-who-do-you-trust/campaign-v2/**"
      - ".github/workflows/harness-production-preflight.yml"
  pull_request:
    branches:
      - fix/harness-back-and-replay-build-h3-20261030
    paths:
      - "android/harness-production/**"
      - "games/harness-who-do-you-trust/campaign-v2/**"
      - ".github/workflows/harness-production-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact production-prep branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        run: |
          SDKMANAGER_PATH="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER_PATH"
          yes | "$SDKMANAGER_PATH" --licenses >/dev/null
          "$SDKMANAGER_PATH" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install pinned Capacitor dependencies
        working-directory: android/harness-production
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run H3 campaign regression gate
        working-directory: games/harness-who-do-you-trust/campaign-v2
        run: npm test && npm run validate

      - name: Stage and validate production web payload
        working-directory: android/harness-production
        run: npm run build:web

      - name: Generate native Android release-candidate project and apply privacy policy
        working-directory: android/harness-production
        run: npm run cap:add:android

      - name: Process release manifest without signing or bundling
        working-directory: android/harness-production/android
        run: ./gradlew :app:processReleaseMainManifest --no-daemon

      - name: Audit native release manifest and permissions
        working-directory: android/harness-production
        run: python3 scripts/audit-native.py

      - name: Guard against committed signing secrets or release bundles
        run: |
          test ! -e android/harness-production/keystore.properties
          test -z "$(find android/harness-production -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.aab' -o -name '*.apk' \) -print -quit)"
          echo "No signing secret or release bundle committed."
