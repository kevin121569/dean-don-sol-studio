name: Harness two-level Android campaign test

on:
  workflow_dispatch:
  push:
    branches:
      - release/harness-android-prep-20261026
    paths:
      - 'games/harness-who-do-you-trust/**'
      - 'android/harness-who-do-you-trust/**'
      - '.github/workflows/harness-r1-android-candidate.yml'

permissions:
  contents: read

jobs:
  test-and-build-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out campaign source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Run Harness engine regression suite
        working-directory: games/harness-who-do-you-trust
        run: |
          npm test
          node tests/astra-audit.mjs

      - name: Install pinned Capacitor toolchain
        working-directory: android/harness-who-do-you-trust
        run: npm install --no-audit --no-fund

      - name: Verify locked V3.4 and assemble two-level campaign
        working-directory: android/harness-who-do-you-trust
        run: npm run build:web

      - name: Generate and sync Android project
        working-directory: android/harness-who-do-you-trust
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK and unsigned release bundle
        working-directory: android/harness-who-do-you-trust/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:bundleRelease --no-daemon --max-workers=2 --console=plain

      - name: Verify final APK contains both campaign levels
        working-directory: android/harness-who-do-you-trust
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          aab=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$apk"
          test -s "$aab"
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.theidealabstudio.harnesswhodoyoutrust.campaign2test'"
          unzip -p "$apk" assets/public/index.html > /tmp/harness-campaign.html
          unzip -p "$apk" assets/public/level-1.html > /tmp/harness-level-1.html
          unzip -p "$apk" assets/public/level-2.html > /tmp/harness-level-2.html
          grep -q 'TWO CASES' /tmp/harness-campaign.html
          grep -q 'COMPLETE LEVEL 1 TO UNLOCK' /tmp/harness-campaign.html
          grep -q 'NEXT="level-2.html"' /tmp/harness-level-1.html
          grep -q 'SERVER 4' /tmp/harness-level-1.html
          grep -q 'YELLOW WORDS ARE TAPPABLE' /tmp/harness-level-1.html
          grep -q 'class="mc-adviser-card' /tmp/harness-level-1.html
          grep -q 'CAMPAIGN COMPLETE' /tmp/harness-level-2.html
          grep -q 'THE MISSING TWO' /tmp/harness-level-2.html
          grep -q 'v12-motorola-audio-scroll-fix' /tmp/harness-level-2.html
          sha256sum "$apk" "$aab" /tmp/harness-campaign.html /tmp/harness-level-1.html /tmp/harness-level-2.html

      - name: Upload two-level campaign device-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harness-two-level-campaign-test
          path: |
            android/harness-who-do-you-trust/android/app/build/outputs/apk/debug/app-debug.apk
            android/harness-who-do-you-trust/android/app/build/outputs/bundle/release/app-release.aab
            android/harness-who-do-you-trust/dist
          retention-days: 30
