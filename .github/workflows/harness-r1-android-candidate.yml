name: Harness V3.4 v12 exact Android device test

on:
  workflow_dispatch:
  push:
    branches:
      - release/harness-android-prep-20261026
    paths:
      - 'games/harness-who-do-you-trust/**'
      - 'android/harness-who-do-you-trust/**'
      - '.github/workflows/harness-r1-android-candidate.yml'

permissions:
  contents: read

jobs:
  test-and-build-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact V3.4 candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Run Harness engine regression suite
        working-directory: games/harness-who-do-you-trust
        run: |
          npm test
          node tests/astra-audit.mjs

      - name: Install pinned Capacitor toolchain
        working-directory: android/harness-who-do-you-trust
        run: npm install --no-audit --no-fund

      - name: Verify exact V3.4 v12 hash, definitions, avatars and test fixes
        working-directory: android/harness-who-do-you-trust
        run: npm run build:web

      - name: Generate and sync Android project
        working-directory: android/harness-who-do-you-trust
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK and unsigned release bundle
        working-directory: android/harness-who-do-you-trust/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:bundleRelease --no-daemon --max-workers=2 --console=plain

      - name: Verify final APK contains exact child-tested V3.4
        working-directory: android/harness-who-do-you-trust
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          aab=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$apk"
          test -s "$aab"
          "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump badging "$apk" | grep -q "package: name='com.theidealabstudio.harnesswhodoyoutrust.v34test'"
          unzip -p "$apk" assets/public/index.html > /tmp/harness-v34.html
          test "$(wc -c < /tmp/harness-v34.html)" -eq 1916208
          echo '83089e531ae5a88162f54d68cee96bb0146f2bf2fa0793333595c704a66d8b60  /tmp/harness-v34.html' | sha256sum -c -
          grep -q 'HARNESS V3.4 · Illustrated Master Control v12' /tmp/harness-v34.html
          grep -q 'YELLOW WORDS ARE TAPPABLE' /tmp/harness-v34.html
          grep -q 'FOUR CLUES CHECKED' /tmp/harness-v34.html
          grep -q 'MAKE YOUR CALL' /tmp/harness-v34.html
          grep -q 'LOOK BACK' /tmp/harness-v34.html
          grep -q 'class="mc-adviser-card' /tmp/harness-v34.html
          grep -q 'v12-motorola-audio-scroll-fix' /tmp/harness-v34.html
          sha256sum "$apk" "$aab"

      - name: Upload exact V3.4 v12 device-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harness-v34-v12-motorola-test
          path: |
            android/harness-who-do-you-trust/android/app/build/outputs/apk/debug/app-debug.apk
            android/harness-who-do-you-trust/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
