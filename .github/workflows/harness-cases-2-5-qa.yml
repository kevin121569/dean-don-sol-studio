name: HARNESS Cases 2–5 Season Regression

on:
  push:
    branches:
      - qa/harness-cases-2-5-season-regression-20261029
    paths:
      - "games/harness-who-do-you-trust/campaign-v2/**"
      - ".github/workflows/harness-cases-2-5-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-season-logic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate five-case runtime hashes and all original regression tests
        working-directory: games/harness-who-do-you-trust/campaign-v2
        run: npm test && npm run validate
      - name: Install browser-test runner
        working-directory: games/harness-who-do-you-trust/campaign-v2
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Stage complete five-case QA browser payload
        working-directory: android/harness-campaign-qa
        run: npm run build:web
      - name: Mobile browser smoke for Cases 2–5
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory android/harness-campaign-qa/dist >/tmp/harness-qa-http.log 2>&1 &
          sleep 2
          node games/harness-who-do-you-trust/campaign-v2/tests/later-cases-browser-smoke.mjs
      - name: Verify isolated QA test scope
        run: |
          CHANGED="$(git diff --name-only 381b7f8873978df7bd064bbbd77c3c1478bedd93 HEAD)"
          printf '%s\n' "$CHANGED"
          test -n "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Ev '^(\.github/workflows/harness-cases-2-5-qa\.yml|games/harness-who-do-you-trust/campaign-v2/tests/(full-season-qa\.test\.mjs|later-cases-browser-smoke\.mjs)); then
            echo "Unexpected gameplay-source modification in QA-only branch." >&2
            exit 1
          fi
