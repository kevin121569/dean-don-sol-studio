name: HARNESS H3 Android Case Menu Back Exit
on:
  push:
    branches:
      - fix/harness-back-and-replay-build-h3-20261030
    paths:
      - ".github/harness-tests/h3-android-back-smoke.py"
      - ".github/workflows/harness-h3-native-back.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-android-back:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download exact Build H3 QA APK artifact
        uses: actions/download-artifact@v4
        with:
          name: HARNESS-QA-FIVE-CASES-FULL5-20261030-H3
          repository: ${{ github.repository }}
          run-id: 41166346984
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: qa-apk
      - name: Check APK checksum and test script
        run: |
          (cd qa-apk && sha256sum -c HARNESS-QA-FIVE-CASES-FULL5-20261030-H3.apk.sha256)
          python3 -m py_compile .github/harness-tests/h3-android-back-smoke.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch H3 and press real Android system Back twice
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python3 .github/harness-tests/h3-android-back-smoke.py
      - name: Upload native Android screenshots and UI hierarchy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HARNESS-H3-Android-Back-Exit-Evidence
          path: harness-h3-android-back-evidence/
          if-no-files-found: warn
          retention-days: 14
