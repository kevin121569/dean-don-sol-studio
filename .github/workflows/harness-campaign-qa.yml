name: HARNESS Five-Case QA APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/harness-five-case-campaign
    paths:
      - "android/harness-campaign-qa/**"
      - "games/harness-who-do-you-trust/campaign-v2/**"
      - ".github/workflows/harness-campaign-qa.yml"

permissions:
  contents: read

jobs:
  build-five-case-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact campaign branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        run: |
          SDKMANAGER_PATH="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER_PATH"
          yes | "$SDKMANAGER_PATH" --licenses >/dev/null
          "$SDKMANAGER_PATH" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install pinned Capacitor dependencies
        working-directory: android/harness-campaign-qa
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run campaign regression gate
        working-directory: games/harness-who-do-you-trust/campaign-v2
        run: npm test && npm run validate

      - name: Stage and validate QA web payload
        working-directory: android/harness-campaign-qa
        run: npm run build:web

      - name: Generate isolated native Android project
        working-directory: android/harness-campaign-qa
        run: npx cap add android

      - name: Build debug APK
        working-directory: android/harness-campaign-qa/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK identity and packaged QA inventory
        working-directory: android/harness-campaign-qa
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep "assets/public/qa-manifest.json"
          unzip -p "$APK" assets/public/qa-manifest.json | grep '"buildId": "FULL5-20261027-E"'
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" > apk-badging.txt
          grep -F "package: name='com.theidealabstudio.harness.campaign.fullqa.e'" apk-badging.txt
          grep -F "application-label:'HARNESS QA E · 5 CASES'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          cp "$APK" HARNESS-QA-FIVE-CASES-FULL5-20261027-E.apk
          sha256sum HARNESS-QA-FIVE-CASES-FULL5-20261027-E.apk > HARNESS-QA-FIVE-CASES-FULL5-20261027-E.apk.sha256

      - name: Upload phone-test APK
        uses: actions/upload-artifact@v4
        with:
          name: HARNESS-QA-FIVE-CASES-FULL5-20261027-E
          path: |
            android/harness-campaign-qa/HARNESS-QA-FIVE-CASES-FULL5-20261027-E.apk
            android/harness-campaign-qa/HARNESS-QA-FIVE-CASES-FULL5-20261027-E.apk.sha256
          if-no-files-found: error
          retention-days: 14

