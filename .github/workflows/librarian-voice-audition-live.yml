name: Librarian voice audition live QA
on:
  push:
    branches:
      - feature/librarian-british-voice-audition-v1-2026-10-11
    paths:
      - .github/workflows/librarian-voice-audition-live.yml
      - tests/librarian-voice-audition-live.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-audition:
    name: Live Audition UI (desktop and phone viewport)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test public preview read-only and local audio
        run: node tests/librarian-voice-audition-live.cjs
