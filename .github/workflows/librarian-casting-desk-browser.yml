name: Librarian A/B Casting Desk branch QA
on:
  push:
    branches:
      - feature/librarian-distance-voice-rehearsal-v1-2026-10-11
    paths:
      - librarian-distance-voice-rehearsal-v1/casting-desk.*
      - tests/librarian-casting-desk-browser.cjs
      - .github/workflows/librarian-casting-desk-browser.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test A/B workflow against actual branch HTML
        run: node tests/librarian-casting-desk-browser.cjs
      - name: Archive rehearsal-only screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: librarian-casting-desk-branch-screenshots
          path: qa-artifacts/distance-casting-*.png
          if-no-files-found: ignore
          retention-days: 14
