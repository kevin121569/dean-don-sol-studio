name: Harness Episode 2 live phone-browser QA
on:
  push:
    branches:
      - feature/harness-ep2-live-chrome-qa-2026-10-10
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Verify Google Chrome
        run: google-chrome --version
      - name: Run phone-sized interactive test against LIVE two-level demo
        run: node scripts/qa/harness_ep2_mobile_chrome.cjs
      - name: Save results and screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-ep2-live-mobile-chrome-qa
          path: qa/ep2/
          retention-days: 14
